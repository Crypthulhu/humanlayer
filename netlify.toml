[build]
  command = "npm install"
  # Seul le site public est servi : le code des fonctions, les scripts et
  # node_modules ne sont plus téléchargeables.
  publish = "public"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# En-têtes de sécurité pour toutes les pages
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000"

# Portails : jamais indexés, jamais mis en cache
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/sentinel/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/client/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# API publique : chemins stables, servis par les fonctions
[[redirects]]
  from = "/api/v1/decisions"
  to = "/.netlify/functions/ai-request"
  status = 200

[[redirects]]
  from = "/api/v1/decision-key"
  to = "/.netlify/functions/decision-key"
  status = 200
